"ReserveControl"
{
	// Following weapons can have edited reserves, even with edited ammo types.
	/// (except AMMO_TYPE_PISTOL or AMMO_TYPE_PISTOL_MAGNUM, since their ammo is infinite)
	// ++ L4D1 Weapons ++
	// ------------------
	//// Standard
//infinite
//	"weapon_pistol"		999
    //default 650
	"weapon_smg"			975 
	//default 72
	"weapon_pumpshotgun"	108
	//default 360
	"weapon_rifle"		540
	//default 90
	"weapon_autoshotgun"	135
	//default 150
	"weapon_hunting_rifle"	225
	
	// ++ L4D2 Weapons ++
	// ------------------
	//// Standard
	//default 650
	"weapon_smg_silenced" 975
	//default 72
	"weapon_shotgun_chrome"	108
	//default 360
	"weapon_rifle_desert" 540
	//default 360
	"weapon_rifle_ak47" 540
	//default 90
	"weapon_shotgun_spas" 135
	//default 180
	"weapon_sniper_military" 270

	//// CS:S Weapons
	//default 650
	"weapon_smg_mp5" 975
	//default 360
	"weapon_rifle_sg552" 540
	//default 180
	"weapon_sniper_scout" 270
	//default 180
	"weapon_sniper_awp"	270
	
	//// Special Tier
	//default 30
    "weapon_grenade_launcher" 45
//infinite
//	"weapon_pistol_magnum"		999
//0 reserve unfortunately
//	"weapon_rifle_m60"			0
}

